[package]
name = "sim-editor"
version = "0.1.0"
edition = "2024"
rust-version = "1.88" # `let` chains
description = "sim: the next-generation Vim, in Rust. It shows even what is hidden, and loses nothing."
license = "MIT OR Apache-2.0"
repository = "https://github.com/efg-technologies/sim"
readme = "../README.md"
keywords = ["editor", "vim", "terminal", "tui", "rust"]
categories = ["text-editors", "command-line-utilities"]

# The package is `sim-editor` (crates.io, AUR); the library is `sim` and the binary is `sim`.
[lib]
name = "sim"
path = "src/lib.rs"

[[bin]]
name = "sim"
path = "src/main.rs"

# The event loop (src/main.rs) runs several of the core's Apps: it needs the crates the core needs
# for the terminal, at the same versions and features, so none of them adds code to the build (SPEC,
# TREE-1). The core is the package `sim-editor-core` (see its Cargo.toml) and the crate `sim_core`.
[dependencies]
sim_core = { package = "sim-editor-core", path = "../core", version = "0.1.0" }
crossterm = { version = "0.29", default-features = false, features = ["events", "bracketed-paste"] }
signal-hook = "0.3"
unicode-width = { version = "0.2", default-features = false }
# PLAIN-1: the effective uid and the parent process (`geteuid`, `getppid`), from the system, not by
# making a file to see who owns it. The core's dependency too, at the same version.
rustix = { version = "1.1", default-features = false, features = ["process"] }
# UI-14: the regex si searches with (it is in the build already), to light the matches of a search.
regex-lite = "0.1"
# SYN-3: the highlighter's thread is given a clone of the buffer's rope (O(1)), never a copy of the text.
ropey = { version = "1.6", default-features = false, features = ["simd"] }
# syntect and its syntaxes, trimmed to what sim uses (SYN-1, SYN-4):
# - default-features off: no onig (C regex), no html, no default themes (sim has its own colors)
# - parsing: the parser and the loader of the compressed syntax dump
# - regex-fancy: the pure-Rust regex backend (fancy-regex)
# - two-face: bat's syntax set (TOML, TypeScript, Dockerfile, ...) instead of syntect's own
#   default one, which is why syntect's `default-syntaxes` is off: the binary holds one set only
syntect = { version = "5", default-features = false, features = ["parsing", "regex-fancy"] }
two-face = { version = "0.5", default-features = false, features = ["syntect-fancy"] }

# TUTOR-4: the lessons of ten languages, deflated. syntect's loader of its syntaxes has this crate and
# its pure-Rust backend in the build already (the same features), and the lessons are read with the
# same decoder on a slice (`bufread`), so no code is added for the unpacking (measured: 0.3 KB; the
# gzip decoder, which is another one, was 33 KB).
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }

[dev-dependencies]
proptest = "1"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
