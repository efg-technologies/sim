[package]
name = "sim"
version = "0.1.0"
edition = "2024"
publish = false

# The event loop (src/main.rs) is si's main.rs for several files: it needs the same crates as that,
# at the same versions and features, so none of them adds code to the build (SPEC, TREE-1).
[dependencies]
si = { path = ".." }
crossterm = { version = "0.29", default-features = false, features = ["events", "bracketed-paste"] }
signal-hook = "0.3"
unicode-width = { version = "0.2", default-features = false }
# syntect, trimmed to what sim uses (SYN-1, SYN-4):
# - default-features off: no onig (C regex), no html, no default themes (sim never uses a color)
# - default-syntaxes: the bundled syntax set, loaded from its compressed dump
# - regex-fancy: the pure-Rust regex backend (fancy-regex)
syntect = { version = "5", default-features = false, features = ["default-syntaxes", "regex-fancy"] }

[dev-dependencies]
proptest = "1"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
