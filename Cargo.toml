# sim is one product in two crates: the core (sim-core, core/) holds what must never lose text and
# has its own line cap and dependency allowlist; the editor (sim-editor, sim/) is the binary `sim`.
[workspace]
members = ["core", "sim"]
resolver = "3"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
