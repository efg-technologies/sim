name: ci

on:
  push:
    branches: [main, ci]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      # Edition 2024 needs Rust 1.85 or newer; stable is far past that.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      # The E2E suites drive si and sim inside tmux (each case on its own socket and no config).
      - name: Install tmux (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y tmux
      - name: Install tmux (macOS)
        if: runner.os == 'macOS'
        run: command -v tmux || brew install tmux
      - run: tmux -V

      # TEMPORARY (removed before merge): every failing test at once, not just the first binary's.
      - name: diagnostic - cargo test --no-fail-fast
        continue-on-error: true
        env:
          GIT_CONFIG_GLOBAL: /dev/null
          GIT_CONFIG_SYSTEM: /dev/null
        run: cargo test --workspace --no-fail-fast

      # TEMPORARY (removed before merge): what check.sh never reaches after a failed test step
      # (trace, release size), and the timings that decide how PROP-1 is checked on this OS.
      - name: diagnostic - trace, release size, PROP-1 timings
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          GIT_CONFIG_GLOBAL: /dev/null
          GIT_CONFIG_SYSTEM: /dev/null
        run: |
          set +e
          sh scripts/trace.sh > /dev/null; echo "si trace rc=$?"
          sh sim/scripts/trace.sh > /dev/null; echo "sim trace rc=$?"
          cargo build --release --workspace
          wc -c target/release/si target/release/sim
          cargo test --test watch -- --nocapture --test-threads=1 prop_1_latency
          cargo build
          for i in 1 2 3 4 5; do
            SI_BIN="$PWD/target/debug/si" sh scripts/e2e.sh --run-one prop_1_an_external_edit_appears_and_is_marked
          done

      # fmt, clippy -D warnings, tests, trace, line cap, release binary size.
      - name: si - scripts/check.sh
        if: ${{ !cancelled() }}
        run: sh scripts/check.sh
      - name: sim - sim/scripts/check.sh
        if: ${{ !cancelled() }}
        run: sh sim/scripts/check.sh

      # No global or system git configuration may leak into the cases (they carry their own
      # identity through the environment). Benches are timing-sensitive and stay out of CI.
      - name: si - scripts/e2e.sh
        if: ${{ !cancelled() }}
        env:
          GIT_CONFIG_GLOBAL: /dev/null
          GIT_CONFIG_SYSTEM: /dev/null
        run: sh scripts/e2e.sh
      - name: sim - sim/scripts/e2e.sh
        if: ${{ !cancelled() }}
        env:
          GIT_CONFIG_GLOBAL: /dev/null
          GIT_CONFIG_SYSTEM: /dev/null
        run: sh sim/scripts/e2e.sh
