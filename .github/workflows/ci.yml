name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      # The code uses `let` chains (Rust 1.88 or newer); stable is far past that.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      # The E2E suites drive sim (and sim --plain, the core alone) inside tmux (each case on its own socket and no config).
      - name: Install tmux (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y tmux
      - name: Install tmux (macOS)
        if: runner.os == 'macOS'
        run: command -v tmux || brew install tmux
      - run: tmux -V

      # fmt, clippy -D warnings, tests, trace, the three line caps, the dependency lists of the core, the editor
      # and the window, release binary size. The window's pixel tests draw on llvmpipe and skip, saying so, where
      # there is none (no GPU, no software Vulkan: they are not run here).
      - name: scripts/check.sh
        if: ${{ !cancelled() }}
        run: sh scripts/check.sh

      # No global or system git configuration may leak into the cases (they carry their own
      # identity through the environment). Benches are timing-sensitive and stay out of CI.
      - name: scripts/e2e.sh (the core as sim --plain, then the editor)
        if: ${{ !cancelled() }}
        env:
          GIT_CONFIG_GLOBAL: /dev/null
          GIT_CONFIG_SYSTEM: /dev/null
        run: sh scripts/e2e.sh
